upstream eupeace_django {
    server web:8000;
}

# --- GDPR COMPLIANT IP ANONYMIZATION ---
map $remote_addr $ip_anonymized {
    ~(?P<ip>\d+\.\d+\.\d+)\.    $ip.0;
    ~(?P<ip>[^:]+:[^:]+):       $ip::;
    default                     0.0.0.0;
}

log_format gdpr_compliant '$ip_anonymized - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';
# --- END GDPR COMPLIANT LOGGING ---

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name proxy.eupeace.eu; # Replace with your deployment domain

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Reverse Proxy with TLS Hardening
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proxy.eupeace.eu; # Replace with your deployment domain

    # Apply GDPR-compliant anonymized access logging
    access_log /var/log/nginx/access.log gdpr_compliant;

    # Buffer tuning for large SAML POST assertions and OAuth2 tokens
    large_client_header_buffers 4 16k;

    # SSL Certificate paths generated via Certbot / Let's Encrypt
    ssl_certificate /etc/nginx/ssl/live/proxy.eupeace.eu/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/proxy.eupeace.eu/privkey.pem;

    # TLS Protocols & Cipher Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://eupeace_django;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        client_max_body_size 50M;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}