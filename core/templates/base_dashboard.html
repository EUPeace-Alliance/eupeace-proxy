<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EUPEACE - Dashboard{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --eupeace-blue: #003865;
            --eupeace-yellow: #F2A900;
            --eupeace-light-gray: #f8f9fa;
        }
        
        /* Flexbox per spingere il footer in basso */
        body {
            font-family: 'Titillium Web', sans-serif;
            background-color: var(--eupeace-light-gray);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .btn-eupeace {
            background-color: var(--eupeace-blue);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-eupeace:hover {
            background-color: #002240; 
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .btn-eupeace-outline {
            border: 2px solid var(--eupeace-blue);
            color: var(--eupeace-blue);
            font-weight: 600;
        }
        .btn-eupeace-outline:hover {
            background-color: var(--eupeace-light-gray);
            color: var(--eupeace-blue);
        }

        /* L'area principale occupa tutto lo spazio disponibile */
        main {
            flex: 1;
            padding: 1.5rem 0;
        }

        footer {
            background-color: white;
            border-top: 1px solid #dee2e6;
            padding: 1.25rem 0;
        }
    </style>
    {% block extra_head %}{% endblock %}
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Contenuto principale (es. dashboard.html) -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer a fondo pagina -->
    <footer class="mt-auto text-center shadow-sm">
        <small>
            <a href="{% url 'service_info' %}" class="text-decoration-none text-muted mx-2 border-bottom">Informazioni / Info</a>
            <span class="text-muted">|</span>
            <a href="{% url 'privacy' %}" class="text-decoration-none text-muted mx-2 border-bottom">Privacy Policy</a>
            <span class="text-muted">|</span>
            <a href="{% url 'helpdesk' %}" class="text-decoration-none text-muted mx-2 border-bottom">Helpdesk</a>
        </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Previene la visualizzazione da Back-Forward Cache (bfcache) del browser dopo il logout
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
