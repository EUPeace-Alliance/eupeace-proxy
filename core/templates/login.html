{% extends 'base.html' %}

{% block title %}Select your University - EUPEACE{% endblock %}

{% block content %}
<h2 class="fw-bold mb-1" style="color: var(--eupeace-blue);">Select your University</h2>
<p class="text-muted mb-4">
    To access the <strong>EUPEACE</strong> services, please authenticate through your institution.<br>
    <small><a href="{% url 'service_info' %}" class="text-muted text-decoration-underline">Informazioni sul servizio / Service info</a></small>
</p>

<div class="mb-5">
    <h5 class="fw-bold mb-3"
        style="color: var(--eupeace-yellow); border-bottom: 2px solid var(--eupeace-yellow); padding-bottom: 5px;">
        EUPEACE Alliance Members
    </h5>

    <form action="{% url 'saml2_login' %}" method="GET">
        <div class="mb-3">
            <select class="form-select form-select-lg" name="idp" id="idp" required>
                <option value="" selected disabled>Choose from the list...</option>

                <!-- Generazione dinamica degli Identity Provider dal database -->
                {% for idp in active_idps %}
                <option value="{{ idp.entity_id }}">{{ idp.name }}</option>
                {% empty %}
                <option value="" disabled>No Identity Providers available at the moment.</option>
                {% endfor %}

            </select>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-eupeace btn-lg fw-bold py-2 rounded-1">
                Login
            </button>
        </div>
    </form>
</div>
{% endblock %}
